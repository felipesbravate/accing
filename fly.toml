# Accing image worker on Fly.io (the web app stays on Vercel). Deploy from the repo root: fly deploy
# The app name must be unique on Fly: if `fly launch` says it is taken, pick another and update WORKER_URL in Vercel.
app = "accing-worker"
primary_region = "cdg"            # Paris, next to Vercel (cdg1)

[build]
  dockerfile = "Dockerfile.worker"

[env]
  PORT = "8080"
  IDLE_EXIT_MINUTES = "10"         # the worker exits after 10 min without jobs, which stops the machine

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"       # never stopped by Fly mid-job: the worker stops itself when idle
  auto_start_machines = true       # a request to /wake starts a stopped machine
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[restart]]
  policy = "on-failure"            # exit 0 (idle) = stay stopped; a crash restarts it
  retries = 3

[[vm]]
  memory = "4gb"                   # 2 GB was killed for memory on the first job (2026-10-29: the pipeline alone used 1.9 GB)
  cpu_kind = "performance"         # dedicated: on shared CPUs Fly throttled the background step from 4 s to 61 s per look (2026-10-30)
  cpus = 2
